syntax = "proto3";

package auth.v1;

import "auth/v1/user.proto";

option go_package = "halooid.com/proto/auth/v1;authv1";

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  User user = 2;
}

message GetCurrentUserRequest {
  // Empty, standard flow implies reading token from metadata instead of body
}

message GetCurrentUserResponse {
  User user = 1;
}

message GetUserByIdRequest {
  string id = 1;
}

message GetUserByIdResponse {
  User user = 1;
}

message GetOrCreateUserRequest {
  string external_id = 1;
  string email = 2;
  string username = 3;
  string tenant_id = 4;
}

message GetOrCreateUserResponse {
  User user = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
  int32 refresh_expires_in = 5;
  string token_type = 6;
  User user = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
  int32 refresh_expires_in = 4;
  string token_type = 5;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegisterResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
  int32 expires_in = 4;
  int32 refresh_expires_in = 5;
  string token_type = 6;
}

// AuthService is responsible for identity mapping and token validation interactions
service AuthService {
  // Login authenticates a user with username/password and returns tokens
  rpc Login(LoginRequest) returns (LoginResponse);

  // Register creates a new user account and returns tokens
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // RefreshToken exchanges a refresh token for a new access token
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);

  // ValidateToken verifies a JWT and returns the parsed user record
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  
  // GetCurrentUser retrieves the user profile for the current authenticated user
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  
  // GetUserById retrieves a user by their internal ID
  rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse);
  
  // GetOrCreateUser ensures the user exists internally based on Keycloak external_id
  rpc GetOrCreateUser(GetOrCreateUserRequest) returns (GetOrCreateUserResponse);
}
